<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GIS Landscape Identifier — MVP</title>

  <!-- ArcGIS Maps SDK for JavaScript (pinned version — vidi docs/architecture-feasibility-review.md, sekcija 3) -->
  <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css" />
  <script type="module" src="https://js.arcgis.com/5.1/"></script>

  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <!-- Mapa + manual observer + heading/FOV/radius kontrole + viewing sector
       (Phase 1-3), rezultati analize i mobile geolocation (originalni brief
       Phase 9 "Visible/blocked UI" + Phase 10, vidi src/main.js docstring
       za napomenu o procjepu u numeraciji faza). -->
  <div id="viewDiv"></div>

  <div id="actionBar" class="action-bar">
    <button id="locateButton" type="button" class="action-button">Koristi moju lokaciju</button>
    <button id="analyzeButton" type="button" class="action-button action-button-primary">Šta gledam?</button>
  </div>

  <div id="controlsPanel" class="controls-panel"></div>

  <div id="resultsPanel" class="results-panel" hidden></div>

  <div id="debugPanel" class="debug-panel"></div>

  <div id="statusBanner" class="status-banner" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
